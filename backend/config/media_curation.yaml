# Curated PSI imagery for investigations without "Representative Image(s)". Identifiers and hashes only: the images
# themselves are generated data (data/media/frames), re-fetched with `fif-app media-fetch`.
# * frame:      one member read out of a PSI archive through HTTP Range requests (the archive is not downloaded).
# * pdf_figure: an image embedded in a CC0 PSI document already in the corpus (no network access).
# * insignia:   project insignia published by PSI, used only as a last resort when no frame or figure qualified.
# Every entry was checked visually (content shows the experiment or its operation; no NASA logo or insignia; no
# sensitive text). `checked` records that visual check; it is NOT a scientific review. Captions describe the source
# only; they do not interpret the image. Pixels are not altered beyond format conversion, resizing and `crop`.
