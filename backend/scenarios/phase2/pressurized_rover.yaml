# PROVISIONAL parameters, configurable. Not an official specification until each source is verified.
# Phase 2 environment: evaluated at request time by app/environments.py with the M6 classifier and tolerances.
# It is NOT part of the M6 build (fif-scenarios reads only scenarios/*.yaml); promote it by moving the file there.
id: pressurized_rover
version: 1
status: provisional
anchor: false
name: {en: "Pressurized lunar rover", es: "Rover lunar presurizado"}
operating_point: {o2_pct: 34, pressure_kpa: 56.5, gravity_g: 0.16}
ranges:
  o2_pct: [32, 34]
  pressure_kpa: [55.2, 56.5]
  flow_cm_s: [0, 20]
  gravity_g: [0.16, 0.16]
gravity_regime: partial_gravity
context: [prevention, detection, suppression]
volume: small_confined
weights: {relevance: 0.30, severity: 0.25, scarcity: 0.20, urgency: 0.15, feasibility: 0.10}
sources:
  o2_pct_min:
    type: official_document
    note: "NASA Exploration Atmospheres Working Group: 8.0 psia / 32 % O2 (original EVA-intensive recommendation)"
    url: "https://ntrs.nasa.gov/api/citations/20220005716/downloads/AsMA%202022%20-%20Garbino%20-%20Exploration%20Atmospheres%20v2.pdf"
    verified: false
  o2_pct_max:
    type: official_document
    note: "EAWG revision to 8.2 psia / 34 % O2; recommended as a capability, not a requirement"
    url: "https://ntrs.nasa.gov/api/citations/20220005716/downloads/AsMA%202022%20-%20Garbino%20-%20Exploration%20Atmospheres%20v2.pdf"
    verified: false
  pressure_kpa_min:
    type: official_document
    note: "8.0 psia = 55.2 kPa (EAWG original recommendation)"
    verified: false
  pressure_kpa_max:
    type: official_document
    note: "8.2 psia = 56.5 kPa (EAWG revised recommendation)"
    verified: false
  flow_cm_s:
    type: team_assumption
    note: "team assumption (cabin ventilation range, same as the other scenarios)"
    verified: false
  gravity_g:
    type: physical_reference
    note: "lunar surface gravity ~0.16 g"
    verified: false
